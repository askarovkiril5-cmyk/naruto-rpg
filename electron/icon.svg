<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона (Тёмная чакра) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Огненная чакра (Лист / Девятихвостый) -->
    <radialGradient id="chakraAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>

    <!-- Золотая спираль печати Удзумаки -->
    <linearGradient id="goldSpiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Неоновое свечение чакры Расенгана / Молнии -->
    <linearGradient id="cyanSpark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Базовый круг -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="6"/>

  <!-- Аура бурлящей чакры -->
  <circle cx="256" cy="256" r="230" fill="url(#chakraAura)" filter="url(#softGlow)"/>

  <!-- Внешнее кольцо печати с 8 триграммами -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldSpiral)" stroke-width="8" stroke-dasharray="24 12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ef4444" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Вспомогательные лучи чакры Листа -->
  <g stroke="url(#goldSpiral)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="36" x2="256" y2="70"/>
    <line x1="256" y1="442" x2="256" y2="476"/>
    <line x1="36" y1="256" x2="70" y2="256"/>
    <line x1="442" y1="256" x2="476" y2="256"/>
    <line x1="100" y1="100" x2="124" y2="124"/>
    <line x1="388" y1="388" x2="412" y2="412"/>
    <line x1="388" y1="100" x2="412" y2="124"/>
    <line x1="100" y1="388" x2="124" y2="412"/>
  </g>

  <!-- Центральная стилизованная спираль Удзумаки (Воля Огня) -->
  <g filter="url(#glow)">
    <!-- Тень спирали -->
    <path d="M 256 256 
             m 0 -120 
             a 120 120 0 1 1 -85 205 
             a 85 85 0 1 1 60 -145 
             a 55 55 0 1 1 -40 94 
             a 28 28 0 1 1 20 -48 
             a 12 12 0 1 1 -8 20" 
          fill="none" 
          stroke="#450a0a" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Основная золотая спираль -->
    <path d="M 256 256 
             m 0 -120 
             a 120 120 0 1 1 -85 205 
             a 85 85 0 1 1 60 -145 
             a 55 55 0 1 1 -40 94 
             a 28 28 0 1 1 20 -48 
             a 12 12 0 1 1 -8 20" 
          fill="none" 
          stroke="url(#goldSpiral)" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- Острие/хвостик знака Листа Конохи -->
    <path d="M 256 136 C 290 100 350 110 370 140 C 350 155 300 160 256 136 Z" 
          fill="url(#goldSpiral)" 
          stroke="#ef4444" 
          stroke-width="3"/>
  </g>

  <!-- Искры молнии Райтона / Расенгана по краям -->
  <g fill="url(#cyanSpark)" filter="url(#glow)">
    <polygon points="120,240 105,255 125,258 110,280 145,252 125,250"/>
    <polygon points="380,230 400,245 385,248 405,270 370,245 385,240"/>
  </g>

  <!-- Центральное золотое ядро печати -->
  <circle cx="253" cy="257" r="10" fill="#fef08a" filter="url(#glow)"/>
</svg>
